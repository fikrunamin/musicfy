name: Build PR

on:
  pull_request:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [Foss, Gms, Fdroid]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            # One fixed key for every run, so each CI APK installs over the previous one
            # (and over local debug builds signed with the same ~/.android/debug.keystore).
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret is not set (e.g. a fork PR). Using a throwaway key: this APK will not install over builds from other runs."
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Unit tests (shared JVM modules + app)
        if: matrix.flavor == 'Foss'
        run: ./gradlew --console=plain jvmTests :app:testUniversalFossDebugUnitTest

      - name: Build Universal ${{ matrix.flavor }} Debug APK
        run: ./gradlew --console=plain assembleUniversal${{ matrix.flavor }}Debug --warning-mode summary
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST: "true"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Lint
        if: matrix.flavor == 'Foss'
        run: ./gradlew --console=plain :app:lintUniversalFossDebug

      - name: Upload APK
        if: matrix.flavor == 'Foss'
        uses: actions/upload-artifact@v6
        with:
          name: app-universal-debug-pr-${{ github.event.number }}
          path: app/build/outputs/apk/universalFoss/debug/*.apk
