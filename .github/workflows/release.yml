name: Release

# Publishes a GitHub Release the in-app updater can install from: push a tag `vX.Y.Z` (or run it
# by hand with a tag name). The release gets exactly the assets the updater looks for:
#   - musicfy.apk     universal GMS release build (core/updater/GithubUpdates.kt picks the only
#                     .apk; musicfyupdater.kt looks for this exact name)
#   - changelog.json  {"description": ..., "changelog": [{"title": ..., "items": [...]}]}, read by
#                     the update screen and the changelog screen
# The app's "Update source" setting (Settings → General) says which repo's releases it reads.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, like v8.1.0 (created on the selected branch if it does not exist yet)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          # the changelog lists the commits since the previous v* tag
          fetch-depth: 0

      - name: Read the version from the tag
        id: version
        run: |
          # The full vX.Y.Z, so the tag is always "v" + the app's versionName (the changelog screen
          # looks up v<versionName>).
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH (e.g. v8.1.0)."
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          if [ "$TAG" != "v$major.$minor.$patch" ]; then
            echo "::error::Write the tag without leading zeros: v$major.$minor.$patch"
            exit 1
          fi
          if [ "$minor" -ge 1000 ] || [ "$patch" -ge 1000 ] || [ "$major" -ge 2000 ]; then
            echo "::error::Tag '$TAG' does not fit the versionCode scheme (major < 2000, minor and patch < 1000)."
            exit 1
          fi
          # versionCode grows with the tag, so every release installs over the one before it
          echo "name=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 1000000 + minor * 1000 + patch))" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG as versionName $major.$minor.$patch, versionCode $((major * 1000000 + minor * 1000 + patch))"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare the signing key
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_KEYSTORE_PASSWORD" ] \
            && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            # app/build.gradle.kts signs release builds with app/keystore/release.keystore when
            # STORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD are set (see the build step's env).
            mkdir -p app/keystore
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
            echo "Signing with the release key from the RELEASE_KEYSTORE_* secrets."
            echo "kind=release" >> "$GITHUB_OUTPUT"
          elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            # Without the release keystore, app/build.gradle.kts signs release builds with the
            # debug config: ~/.android/debug.keystore (androiddebugkey / android).
            echo "::warning title=Release APK signed with the DEBUG key::The RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD secrets are not all set, so musicfy.apk is signed with the fixed debug keystore (DEBUG_KEYSTORE_BASE64). It installs over other builds signed with that key, never over builds signed with a real release key. Add the four RELEASE_* secrets to sign releases with your own key."
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "kind=debug" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No signing key: set the four RELEASE_KEYSTORE_*/RELEASE_KEY_* secrets, or at least DEBUG_KEYSTORE_BASE64. A release signed with a throwaway key could never be updated in place."
            exit 1
          fi

      - name: Build the release APK
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleUniversalGmsRelease --no-configuration-cache --console=plain --warning-mode summary \
            -PreleaseVersionName="${{ steps.version.outputs.name }}" \
            -PreleaseVersionCode="${{ steps.version.outputs.code }}"

      - name: Collect musicfy.apk
        run: |
          mkdir -p dist
          shopt -s nullglob
          apks=(app/build/outputs/apk/universalGms/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release APK, found ${#apks[@]}: ${apks[*]}"
            exit 1
          fi
          cp "${apks[0]}" dist/musicfy.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$apksigner" verify --print-certs dist/musicfy.apk | grep -E 'Signer #1 certificate (DN|SHA-256)'
          echo "Signed with the ${{ steps.signing.outputs.kind }} key."

      - name: Write changelog.json and the release notes
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          # Commits since the previous v* tag (or the last 100 when there is none), merges left out.
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          if [ -n "$prev" ]; then range="$prev..HEAD"; else range="HEAD"; fi
          git log --no-merges --max-count=100 --format='%s' "$range" > dist/subjects.txt
          echo "Changelog: $(wc -l < dist/subjects.txt) commit(s) in ${range}"
          jq -n \
            --arg description "Musicfy $VERSION_NAME" \
            --rawfile subjects dist/subjects.txt \
            '($subjects | split("\n") | map(select(length > 0))) as $items
             | { description: $description,
                 changelog: [ { title: "Changes",
                                items: (if ($items | length) > 0 then $items else ["Maintenance release"] end) } ] }' \
            > dist/changelog.json
          jq -r '"## Changes", "", (.changelog[0].items[] | "- " + .)' dist/changelog.json > dist/notes.md
          cat dist/changelog.json

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Musicfy ${{ steps.version.outputs.name }}
          body_path: dist/notes.md
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            dist/musicfy.apk
            dist/changelog.json
